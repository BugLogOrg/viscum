<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>芽＝🌱 preview</title>
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: #f7f3eb;
        font-family: system-ui, sans-serif;
        color: #3d4a3a;
      }
      .row {
        display: flex;
        align-items: end;
        gap: 1.5rem;
      }
      .cell {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.5rem;
      }
      .soft {
        background: #e0ead6;
        border-radius: 1rem;
        padding: 1.25rem 1.5rem;
      }
      label {
        font-size: 12px;
        opacity: 0.7;
      }
    </style>
  </head>
  <body>
    <div class="soft">
      <div class="row">
        <div class="cell">
          <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden>
            <text x="12" y="16.8" text-anchor="middle" font-size="17">🌱</text>
          </svg>
          <label>h-7</label>
        </div>
        <div class="cell">
          <svg viewBox="0 0 24 24" width="40" height="40" aria-hidden>
            <text x="12" y="16.8" text-anchor="middle" font-size="17">🌱</text>
          </svg>
          <label>ピッカー</label>
        </div>
        <div class="cell">
          <svg viewBox="0 0 24 24" width="96" height="96" aria-hidden>
            <text x="12" y="16.8" text-anchor="middle" font-size="17">🌱</text>
          </svg>
          <label>拡大 🌱直載せ</label>
        </div>
      </div>
    </div>
  </body>
</html>
