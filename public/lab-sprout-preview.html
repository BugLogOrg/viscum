<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>芽＝固定SVG preview</title>
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: #f7f3eb;
        font-family: system-ui, sans-serif;
        color: #3d4a3a;
      }
      .row {
        display: flex;
        align-items: end;
        gap: 1.5rem;
      }
      .cell {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.5rem;
      }
      .soft {
        background: #e0ead6;
        border-radius: 1rem;
        padding: 1.25rem 1.5rem;
      }
      label {
        font-size: 12px;
        opacity: 0.7;
      }
      img {
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="soft">
      <div class="row">
        <div class="cell">
          <img src="/icons/protocol-sprout.svg" width="28" height="28" alt="" />
          <label>h-7</label>
        </div>
        <div class="cell">
          <img src="/icons/protocol-sprout.svg" width="40" height="40" alt="" />
          <label>ピッカー</label>
        </div>
        <div class="cell">
          <img src="/icons/protocol-sprout.svg" width="96" height="96" alt="" />
          <label>拡大・固定アセット</label>
        </div>
      </div>
      <p style="margin: 1rem 0 0; font-size: 12px; opacity: 0.65; text-align: center">
        ※このHTMLは本番パス前提。ローカルfile://だと画像が欠ける場合あり →
        /lab/protocol を見てください
      </p>
    </div>
  </body>
</html>
